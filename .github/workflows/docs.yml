name: docs

on:
  # 每当 push 到 release 分支时触发部署
  push:
    branches: [release]
  # 手动触发部署
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 系统

    steps:
      # 1. 拉取代码（包含完整 Git 历史记录，用于生成"最近更新时间"）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 Node.js 环境（使用 npm）
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 指定 Node.js 版本
          cache: npm # 缓存 npm 依赖，加速后续构建

      # 3. 安装依赖（严格按 lockfile 版本）
      - name: 安装依赖
        run: npm ci # 等同于 `npm install --frozen-lockfile`

      # 运行构建脚本
      - name: 构建 VuePress 站点
        run: npm run docs:build

      # 查看 workflow 的文档来获取更多信息
      # @see https://github.com/crazy-max/ghaction-github-pages
      - name: 部署到 GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages # 部署到 gh-pages 分支
          build_dir: docs/.vuepress/dist # VuePress 默认输出目录
        env:
          # @see https://docs.github.com/cn/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
